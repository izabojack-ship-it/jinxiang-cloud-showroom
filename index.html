<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c1016">
  <title>金享車業雲端展間 · 360° 環景</title>
  <meta name="description" content="金享車業雲端展間 · 15 站 360° 虛擬實境環景導覽">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.14.1/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.14.1/index.css">
  <link rel="stylesheet" href="./css/tour.css?v=89">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
      "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.14.1/index.module.js",
      "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.14.1/index.module.js",
      "@photo-sphere-viewer/autorotate-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin@5.14.1/index.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="viewer" aria-label="360° 環景檢視器"></div>

  <div id="f360-loader" class="f360-loader" role="status" aria-live="polite">
    <div class="f360-loader__inner">
      <div class="f360-loader__ring" aria-hidden="true"></div>
      <p class="f360-loader__title">金享車業雲端展間</p>
      <p class="f360-loader__sub">正在載入環景導覽…</p>
    </div>
  </div>

  <div id="f360-fade" class="f360-fade" aria-hidden="true"></div>

  <div class="f360-ui">
    <button id="f360-panels-toggle" type="button" class="f360-panels-toggle" aria-expanded="true" aria-controls="f360-brand f360-next-card">
      <span class="f360-panels-toggle__chev" aria-hidden="true"></span>
      <span id="f360-panels-toggle-label" class="f360-panels-toggle__label">收合資訊</span>
    </button>

    <header id="f360-brand" class="f360-brand">
      <p class="f360-brand__eyebrow">虛擬實境工廠導覽</p>
      <p class="f360-brand__title">金享車業雲端展間</p>
      <div class="f360-brand__meta">
        <p id="f360-scene-name" class="f360-brand__scene"></p>
        <p id="f360-floor" class="f360-brand__floor"></p>
      </div>
      <div class="f360-progress" aria-hidden="true">
        <div id="f360-progress-bar" class="f360-progress__bar"></div>
      </div>
      <p id="f360-progress-text" class="f360-progress__text"></p>
    </header>

    <aside id="f360-next-card" class="f360-next-card" aria-live="polite">
      <span class="f360-next-card__tag">建議下一站</span>
      <p id="f360-next-name" class="f360-next-card__name">—</p>
      <p class="f360-next-card__hint">旋轉畫面，點擊金色熱點前往</p>
      <button id="f360-goto-next" type="button" class="f360-next-card__btn">前往下一站</button>
    </aside>

    <div class="f360-route-controls" aria-label="動線控制">
      <button id="f360-prev" type="button" class="f360-route-btn" disabled>
        <span class="f360-route-btn__arrow" aria-hidden="true">←</span>
        <span class="f360-route-btn__label">
          <span class="f360-route-btn__kicker">上一站</span>
          <span id="f360-prev-name" class="f360-route-btn__name">—</span>
        </span>
      </button>
      <button id="f360-reset" type="button" class="f360-reset" aria-label="重設視角">重設視角</button>
      <button id="f360-next" type="button" class="f360-route-btn f360-route-btn--primary" disabled>
        <span class="f360-route-btn__label">
          <span class="f360-route-btn__kicker">下一站</span>
          <span id="f360-next-btn-name" class="f360-route-btn__name">—</span>
        </span>
        <span class="f360-route-btn__arrow" aria-hidden="true">→</span>
      </button>
    </div>

    <div class="f360-radar" aria-label="方位指示">
      <svg class="f360-radar__svg" viewBox="0 0 80 80" aria-hidden="true">
        <circle class="f360-radar__disc" cx="40" cy="40" r="36"></circle>
        <circle class="f360-radar__grid" cx="40" cy="40" r="24"></circle>
        <circle class="f360-radar__grid" cx="40" cy="40" r="12"></circle>
        <line class="f360-radar__grid" x1="40" y1="4" x2="40" y2="76"></line>
        <line class="f360-radar__grid" x1="4" y1="40" x2="76" y2="40"></line>
        <line id="f360-radar-beam" class="f360-radar__beam" x1="40" y1="40" x2="40" y2="10"></line>
        <text class="f360-radar__n" x="40" y="14" text-anchor="middle">N</text>
      </svg>
      <span class="f360-radar__caption">閒置自動旋轉 · 拖曳可暫停</span>
    </div>

    <aside id="f360-guide" class="f360-guide" hidden aria-label="虛擬導覽員">
      <div class="f360-presenter" data-guide-avatar aria-hidden="true">
        <img
          class="f360-presenter__img"
          src="./media/guide/presenter_closed.png"
          alt=""
          decoding="async"
        >
        <img
          class="f360-presenter__img f360-presenter__img--open"
          src="./media/guide/presenter_open.png"
          alt=""
          decoding="async"
        >
        <div class="f360-presenter__plate">
          <p class="f360-presenter__name" data-guide-name>金享導覽員</p>
          <p class="f360-presenter__status" data-guide-status>待命</p>
          <span class="f360-guide__eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
      <div class="f360-subtitle">
        <p class="f360-subtitle__title" data-guide-title></p>
        <p class="f360-subtitle__text" data-guide-text></p>
        <div class="f360-subtitle__poi" data-guide-poi-list hidden></div>
        <div class="f360-subtitle__actions">
          <button type="button" class="f360-guide__btn f360-guide__btn--primary" data-guide-play>播放語音</button>
          <button type="button" class="f360-guide__btn" data-guide-stop>停止</button>
          <button type="button" class="f360-guide__btn" data-guide-mute aria-pressed="false">靜音</button>
          <button type="button" class="f360-guide__btn" data-guide-solo>專注導覽</button>
          <button type="button" class="f360-guide__btn" data-guide-close>收起導覽員</button>
        </div>
      </div>
    </aside>

    <button id="f360-guide-open" type="button" class="f360-guide-open" aria-hidden="true">
      <span class="f360-guide-open__dot" aria-hidden="true"></span>
      開啟導覽員
    </button>

    <div id="f360-place-toast" class="f360-place-toast" role="status" aria-live="polite"></div>

    <aside id="f360-place-panel" class="f360-place-panel" hidden aria-label="機台點位編輯">
      <div class="f360-place-panel__head">
        <div>
          <p class="f360-place-panel__eyebrow">定位編輯（本機）</p>
          <h2 class="f360-place-panel__title">機台點位設計</h2>
        </div>
        <a class="f360-place-panel__link" href="./editor.html" id="f360-place-editor-link">文案編輯</a>
      </div>
      <p class="f360-place-panel__hint">
        先選機台，再點環景正確位置；座標會立刻寫入本機預覽。也可在此改標題與介紹。
      </p>
      <div id="f360-place-list" class="f360-place-list"></div>
      <div id="f360-place-form" class="f360-place-form" hidden>
        <label class="f360-place-field">
          <span>標題</span>
          <input type="text" id="f360-place-title" maxlength="60">
        </label>
        <label class="f360-place-field">
          <span>介紹文案</span>
          <textarea id="f360-place-body" rows="3"></textarea>
        </label>
        <div class="f360-place-coords">
          <span>目前座標</span>
          <code id="f360-place-coords">尚未定位</code>
        </div>
        <div class="f360-place-form__actions">
          <button type="button" class="f360-place-btn f360-place-btn--primary" id="f360-place-save-text">儲存文案</button>
          <button type="button" class="f360-place-btn" id="f360-place-focus">對準此點</button>
        </div>
      </div>
      <div class="f360-place-panel__foot">
        <button type="button" class="f360-place-btn" id="f360-place-add">新增機台點</button>
        <button type="button" class="f360-place-btn" id="f360-place-exit">結束定位</button>
      </div>
    </aside>

    <div id="f360-thumbs-dock" class="f360-thumbs-dock">
      <button id="f360-thumbs-toggle" type="button" class="f360-thumbs-toggle" aria-expanded="true" aria-controls="f360-thumbs">
        <span class="f360-thumbs-toggle__label">展區動線</span>
        <span id="f360-thumbs-toggle-meta" class="f360-thumbs-toggle__meta">15 站</span>
        <span class="f360-thumbs-toggle__chev" aria-hidden="true"></span>
      </button>
      <nav id="f360-thumbs" class="f360-thumbs" aria-label="導覽動線站點"></nav>
    </div>
  </div>

  <script type="module" src="./js/tour.js?v=89"></script>
</body>
</html>
